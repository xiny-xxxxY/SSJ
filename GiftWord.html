<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>深水井毕业寄语 · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;600;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0a0c;
    --bg-surface: #141418;
    --accent: #e0a0a8;
    --accent-dim: #b07078;
    --accent-glow: rgba(224, 160, 168, 0.25);
    --text-primary: #f2ede3;
    --text-muted: #6b665c;
    --text-subtle: #3d3a35;
    --radius: 14px;
    --font-display: 'Noto Serif SC', serif;
    --font-body: 'Noto Sans SC', sans-serif;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow-x: hidden;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  body {
    overflow-x: hidden;
    touch-action: pan-y;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 9999;
  }

  .ambient {
    position: fixed;
    width: 300px; height: 300px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
    z-index: 0;
  }
  .ambient--1 { top: -80px; left: -60px; background: var(--accent-glow); }
  .ambient--2 { bottom: -100px; right: -80px; background: rgba(180, 120, 140, 0.12); }
  .ambient.visible { opacity: 1; }

  /* ----- 公用屏幕容器 ----- */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    z-index: 1;
    transition: opacity 0.6s ease, transform 0.6s ease;
    overflow-y: auto;
  }

  .screen--input { opacity: 1; transform: scale(1); background: var(--bg-deep); }
  .screen--input.hidden {
    opacity: 0; transform: scale(0.95);
    pointer-events: none;
  }

  .logo-mark {
    width: 108px;
    height: 108px;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeDown 0.8s ease 0.2s forwards;
  }
  .logo-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .input-title {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(22px, 6vw, 30px);
    letter-spacing: 0.12em;
    color: var(--text-primary);
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeDown 0.8s ease 0.35s forwards;
  }

  .input-subtitle {
    font-size: 13px;
    font-weight: 300;
    color: var(--text-muted);
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeDown 0.8s ease 0.5s forwards;
  }

  .input-group {
    width: 100%;
    max-width: 320px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.65s forwards;
  }

  .name-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--text-subtle);
    padding: 16px 4px;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    text-align: center;
    letter-spacing: 0.08em;
    outline: none;
    transition: border-color 0.4s ease;
  }
  .name-input::placeholder { color: var(--text-subtle); font-weight: 300; }
  .name-input:focus { border-color: var(--accent); }

  .submit-btn {
    display: block;
    width: 100%;
    max-width: 320px;
    margin-top: 40px;
    padding: 16px;
    background: transparent;
    border: 1.5px solid var(--accent-dim);
    border-radius: var(--radius);
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.2em;
    cursor: pointer;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.8s forwards;
    transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, letter-spacing 0.3s ease;
  }
  .submit-btn:active {
    background: var(--accent);
    color: var(--bg-deep);
    border-color: var(--accent);
    letter-spacing: 0.28em;
  }
  .submit-btn:disabled { opacity: 0.3; pointer-events: none; }

  /* ========== 新版结果屏幕 - 统一高度，滚动区独立，签名分离 ========== */
  .screen--result {
    opacity: 0;
    transform: scale(1.02);
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--bg-deep);
    padding: 0;
    overflow: hidden;
    touch-action: pan-y;
  }
  .screen--result.visible {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* 轮播主容器 */
  .carousel {
    width: 100%;
    max-width: 560px;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    min-height: 0;
    margin: 0 auto;
  }

  .carousel-track {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), filter 0.16s ease;
    will-change: transform;
  }

  .carousel-track.is-transitioning {
    filter: blur(3px);
  }

  /* 单个卡片：弹性列，保证统一高度 */
  .carousel-slide {
    flex: 0 0 100%;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 18px 24px 20px;
    background: var(--bg-deep);
    overflow-y: visible;
  }

  /* 固定头部区 (致 + 姓名 + 装饰线) 居中 */
  .fixed-header {
    flex-shrink: 0;
    text-align: center;
    padding-top: 24px;
  }
  .result-label {
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeDown 0.5s ease forwards;
    animation-delay: 0s;
  }
  .result-name {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(28px, 8vw, 42px);
    color: var(--accent);
    letter-spacing: 0.06em;
    line-height: 1.2;
    margin-bottom: 12px;
    opacity: 0;
    animation: nameReveal 0.8s ease forwards;
    text-shadow: 0 0 30px var(--accent-glow);
    animation-delay: 0s;
  }
  .result-divider {
    width: 42px;
    height: 1.5px;
    background: var(--accent-dim);
    margin: 8px auto 0;
    opacity: 0;
    animation: fadeDown 0.5s ease 0.1s forwards;
    animation-delay: 0s;
  }

  /* 可滚动文案区域：仅包含正文，带上下渐进模糊效果 */
  .scrollable-message {
    flex: 1;
    position: relative;
    margin: 12px 0 8px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 4px 16px 4px;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: transparent transparent ;
    mask-image: linear-gradient(to bottom, 
      transparent 0%, 
      black 10%, 
      black 90%, 
      transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, 
      transparent 0%, 
      black 10%, 
      black 90%, 
      transparent 100%);
  }
  .scrollable-message::-webkit-scrollbar {
    width: 1px;
  }
/* track 和 thumb 默认透明 */
  .scrollable-message::-webkit-scrollbar-track {
    background: transparent;
    border-radius: 10px;
    transition: background 0.4s ease;
  }
  .scrollable-message::-webkit-scrollbar-thumb {
    background: transparent;
    border-radius: 10px;
    transition: background 0.4s ease;
  }

/* 滚动中显示滚动条 */
  .scrollable-message.scrolling {
    scrollbar-color: var(--accent-dim) var(--bg-surface);
  } 
  .scrollable-message.scrolling::-webkit-scrollbar-track {
    background: var(--bg-surface);
  }
  .scrollable-message.scrolling::-webkit-scrollbar-thumb {
    background: var(--accent-dim);
  }

  /* 正文样式 + 文字居中 */
  .result-quote {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(14px, 4.2vw, 17px);
    color: var(--text-primary);
    line-height: 1.85;
    letter-spacing: 0.02em;
    white-space: pre-line;
    text-align: center;
  }

  /* 签名独立区域 (不滚动，在文案区域下方，向左移动两个字符位) */
  .signature-area {
    flex-shrink: 0;
    text-align: right;
    margin-left: 0;
    margin-right: 2em;        
    margin-top: 6px;
    margin-bottom: 10px;
    font-family: var(--font-body);
    font-size: 18px;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    padding-top: 6px;
    border-top: 0.5px solid rgba(176, 112, 120, 0.3);
    width: calc(100% - 2em);
  }

  /* 底部全局区域（页码＋深水井标＋重新输入）*/
  .result-footer-area {
    flex-shrink: 0;
    text-align: center;
    margin-top: 4px;
    padding-bottom: 14px;
  }
  .page-indicator {
    font-size: 11px;
    color: var(--text-subtle);
    letter-spacing: 0.2em;
    margin-bottom: 12px;
  }
  .result-footer {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    line-height: 1.5;
  }
  .restart-btn {
    background: none;
    border: none;
    color: var(--text-subtle);
    font-size: 11px;
    letter-spacing: 0.2em;
    cursor: pointer;
    padding: 10px 18px;
    margin-top: 8px;
    transition: color 0.2s ease;
  }
  .restart-btn:active { color: var(--accent); }

  /* 左右箭头 */
  .carousel-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(10, 10, 12, 0.55);
    backdrop-filter: blur(4px);
    border: none;
    color: var(--accent-dim);
    font-size: 38px;
    font-weight: 300;
    width: 44px;
    height: 44px;
    border-radius: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.3s ease, background 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .carousel-nav:active {
    background: var(--accent);
    color: var(--bg-deep);
  }
  .carousel-nav.visible { opacity: 0.7; }
  .carousel-prev { left: 10px; }
  .carousel-next { right: 10px; }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes nameReveal {
    0%   { opacity: 0; transform: translateY(20px) scale(0.92); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* 粒子动画 */
  .particles {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }
  @keyframes particleRise {
    0%{opacity:0; transform:translateY(0) scale(1)}
    15%{opacity:0.7}
    85%{opacity:0.3}
    100%{opacity:0; transform:translateY(-100vh) scale(0.3)}
  }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-3px); }
    80%{ transform:translateX(3px); }
  }

  @media (max-width: 560px) {
    .carousel-slide { padding: 14px 18px 16px; }
    .scrollable-message { margin: 8px 0; }
    .signature-area { margin-left: 0;  margin-right: 1.5em; font-size: 15px; text-align: right; width: calc(100% - 1.5em);}
  }
</style>
</head>

  // DOM 元素
  const $inputScreen = document.getElementById('screenInput');
  const $resultScreen = document.getElementById('screenResult');
  const $nameInput = document.getElementById('nameInput');
  const $submitBtn = document.getElementById('submitBtn');
  const $track = document.getElementById('carouselTrack');
  const $prevBtn = document.getElementById('prevBtn');
  const $nextBtn = document.getElementById('nextBtn');
  const $indicator = document.getElementById('pageIndicator');
  const $restartBtn = document.getElementById('restartBtn');
  const $particles = document.getElementById('particles');

  let currentIdx = 0;
  let userName = '';

  // 安全转义
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // 文本格式化：将 \n 转为 <br>，并额外在最前面添加两个空行 (两个<br>) 以避免顶部模糊遮盖
  function formatTextWithLeadingBreaks(txt) {
    if (!txt) return '';
    // 先将已有换行转为 <br>
    let inner = txt.replace(/\n/g, '<br>');
    // 在每个卡片文案前加两行空行（即两个 <br>）防止首行被渐变遮罩半透明
    return '<br><br>' + inner;
  }

  // 构建所有卡片 (新结构：固定头部 + 仅文案滚动区 + 独立签名)
  function buildSlides(name) {
    $track.innerHTML = '';
    quotes.forEach((item, idx) => {
      const slide = document.createElement('div');
      slide.className = 'carousel-slide';

      // 1. 固定头部 (致 + 姓名)
     
      // 2. 可滚动文案区域 (仅包含正文，前加两个<br>保证留白)
      const scrollArea = document.createElement('div');
      scrollArea.className = 'scrollable-message';
      const quoteDiv = document.createElement('div');
      quoteDiv.className = 'result-quote';
      // 加入前置空行＋内容
      quoteDiv.innerHTML = formatTextWithLeadingBreaks(item.text);
      scrollArea.appendChild(quoteDiv);

      // 3. 签名独立区域 (不滚动，左移2字符)
      const signatureDiv = document.createElement('div');
      signatureDiv.className = 'signature-area';
      signatureDiv.innerHTML = `— ${escapeHtml(item.by)}`;

      // 组装卡片
      slide.appendChild(scrollArea);
      slide.appendChild(signatureDiv);
      
      $track.appendChild(slide);
    });
  }

  // 重置当前卡片滚动区位置到顶部
  function resetScrollOnCurrentSlide() {
    const slides = document.querySelectorAll('.carousel-slide');
    if (slides[currentIdx]) {
      const scrollContainer = slides[currentIdx].querySelector('.scrollable-message');
      if (scrollContainer) scrollContainer.scrollTop = 0;
    }
  }

  // 更新轮播位置、箭头和页码
  function updateCarousel() {
   const total = quotes.length;
    if (total === 0) return;
    const percent = currentIdx * 100;

    // 先移除再添加，防止快速点击时 class 状态错乱
    $track.classList.remove('is-transitioning');
    void $track.offsetHeight; // 强制 reflow
    $track.classList.add('is-transitioning');

    $track.style.transform = `translateX(-${percent}%)`;
    $indicator.innerText = `${currentIdx + 1} / ${total}`;
    
    $prevBtn.classList.toggle('visible', currentIdx > 0);
    $nextBtn.classList.toggle('visible', currentIdx < total - 1);
    
    resetScrollOnCurrentSlide();
  }

  // 展示结果
  function showResult(name) {
    userName = name;
    currentIdx = 0;
    buildSlides(userName);
    document.getElementById('fixedName').textContent = userName;
    updateCarousel();

    $inputScreen.classList.add('hidden');
    $resultScreen.classList.add('visible');
    
    spawnParticles();
    document.body.style.overflowX = 'hidden';
  }

  // 重启流程
  function restartFlow() {
    $resultScreen.classList.remove('visible');
    $inputScreen.classList.remove('hidden');
    $nameInput.value = '';
    $submitBtn.disabled = true;
    $particles.innerHTML = '';
    currentIdx = 0;
    setTimeout(() => $nameInput.focus(), 120);
    document.body.style.overflowX = 'hidden';
    document.getElementById('fixedName').textContent = '';

  }

  // 粒子效果
  function spawnParticles() {
    $particles.innerHTML = '';
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 2 + Math.random() * 4;
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        bottom: -20px;
        width: ${size}px;
        height: ${size}px;
        background: var(--accent);
        position: absolute;
        opacity: 0;
        animation: particleRise ${2 + Math.random() * 4}s ease-out ${Math.random() * 2}s infinite;
      `;
      $particles.appendChild(p);
    }
  }

  // 输入监听
  $nameInput.addEventListener('input', () => {
    $submitBtn.disabled = $nameInput.value.trim().length === 0;
  });

  $submitBtn.addEventListener('click', () => {
    const rawName = $nameInput.value.trim();
    if (!rawName) {
      $nameInput.parentElement.classList.add('shake');
      setTimeout(() => $nameInput.parentElement.classList.remove('shake'), 400);
      return;
    }
    showResult(rawName);
  });

  $nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !$submitBtn.disabled) $submitBtn.click();
  });
$track.addEventListener('transitionend', (e) => {
    if (e.propertyName === 'transform') {
        $track.classList.remove('is-transitioning');
    }
});

// 滚动条 2 秒无滚动自动隐藏
document.addEventListener('scroll', (e) => {
    const target = e.target;
    if (target.classList && target.classList.contains('scrollable-message')) {
        target.classList.add('scrolling');
        clearTimeout(target._hideTimer);
        target._hideTimer = setTimeout(() => {
            target.classList.remove('scrolling');
        }, 1200);
    }
}, true);

  $prevBtn.addEventListener('click', () => {
    if (currentIdx > 0) {
      currentIdx--;
      updateCarousel();
    }
  });



  $nextBtn.addEventListener('click', () => {
    if (currentIdx < quotes.length - 1) {
      currentIdx++;
      updateCarousel();
    }
  });
  
  $restartBtn.addEventListener('click', restartFlow);

  // 禁止触摸左右滑动 (强化水平拦截)
  $resultScreen.addEventListener('touchstart', (e) => {
    this.startX = e.touches[0].clientX;
    this.startY = e.touches[0].clientY;
  }, { passive: false });
  
  $resultScreen.addEventListener('touchmove', (e) => {
    if (!this.startX) return;
    const deltaX = Math.abs(e.touches[0].clientX - this.startX);
    const deltaY = Math.abs(e.touches[0].clientY - (this.startY || e.touches[0].clientY));
    if (deltaX > deltaY && deltaX > 6) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, { passive: false });
  
  $resultScreen.addEventListener('touchend', () => {
    this.startX = null;
    this.startY = null;
  });

  // 启动环境光晕
  setTimeout(() => {
    document.querySelectorAll('.ambient').forEach(el => el.classList.add('visible'));
  }, 200);
  
  window.addEventListener('resize', () => {
    if ($resultScreen.classList.contains('visible')) {
      document.body.style.overflowX = 'hidden';
    }
  });
</script>
